<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Copy Unbound - Select freely. Copy normally.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1A30"/>
      <stop offset="1" stop-color="#10254A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <ellipse cx="215" cy="185" rx="210" ry="150" fill="url(#glow)"/>

  <!-- emblem: page card with selected text and open lock -->
  <g>
    <rect x="115" y="95" width="230" height="190" rx="16" fill="#16233D" stroke="#24344F"/>
    <rect x="95" y="78" width="230" height="192" rx="16" fill="#F1F5F9"/>
    <g>
      <rect x="120" y="106" width="150" height="12" rx="6" fill="#CBD5E1"/>
      <rect x="120" y="128" width="180" height="12" rx="6" fill="#CBD5E1"/>
      <rect x="120" y="150" width="140" height="12" rx="6" fill="#94A3B8"/>
      <rect x="120" y="172" width="180" height="12" rx="6" fill="#94A3B8"/>
      <rect x="120" y="194" width="112" height="12" rx="6" fill="#CBD5E1"/>
      <rect x="120" y="216" width="152" height="12" rx="6" fill="#CBD5E1"/>
    </g>
    <rect x="114" y="144" width="196" height="46" rx="8" fill="#3B82F6" opacity="0.28"/>
    <path transform="translate(304,182) scale(1.05)" d="M0 0 L0 18 L4.6 13.8 L7.8 21 L10.4 19.6 L7.2 12.6 L13.4 12.6 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="320" cy="252" r="34" fill="url(#badge)" stroke="#0B1220" stroke-width="6"/>
    <path d="M308 250 v-8 a12 12 0 0 1 24 0 v5" transform="rotate(-16 308 250)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <rect x="304" y="250" width="32" height="22" rx="5" fill="#FFFFFF"/>
    <circle cx="320" cy="258" r="3.4" fill="#2563EB"/>
    <rect x="318.6" y="259.5" width="2.8" height="7" rx="1.4" fill="#2563EB"/>
  </g>

  <!-- selection marquee deco -->
  <rect x="908" y="48" width="212" height="52" rx="10" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 7" opacity="0.4"/>
  <text x="1014" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="600" fill="#3B82F6" opacity="0.55">Ctrl+C</text>
  <path transform="translate(1108,94) scale(0.85)" d="M0 0 L0 18 L4.6 13.8 L7.8 21 L10.4 19.6 L7.2 12.6 L13.4 12.6 Z" fill="#60A5FA" opacity="0.75"/>

  <!-- title -->
  <text x="432" y="163" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="70" font-weight="800" letter-spacing="-1" fill="#F8FAFC">Copy <tspan fill="url(#accent)">Unbound</tspan></text>
  <text x="435" y="208" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#E2E8F0">Select freely. Copy normally.</text>
  <text x="435" y="246" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, system-ui, sans-serif" font-size="19" fill="#7C8DA6">막힌 텍스트 선택과 복사를 다시 자유롭게</text>

  <!-- chips -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(435,280)">
      <rect width="162" height="32" rx="16" fill="#12203A" stroke="#28415F"/>
      <circle cx="20" cy="16" r="4" fill="#22D3EE"/>
      <text x="34" y="21" fill="#A9C0DC">Chrome Extension</text>
    </g>
    <g transform="translate(609,280)">
      <rect width="122" height="32" rx="16" fill="#12203A" stroke="#28415F"/>
      <circle cx="20" cy="16" r="4" fill="#60A5FA"/>
      <text x="34" y="21" fill="#A9C0DC">No Tracking</text>
    </g>
    <g transform="translate(743,280)">
      <rect width="102" height="32" rx="16" fill="#12203A" stroke="#28415F"/>
      <circle cx="20" cy="16" r="4" fill="#818CF8"/>
      <text x="34" y="21" fill="#A9C0DC">Auto-run</text>
    </g>
  </g>
</svg>
