<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="0.55" stop-color="#6846FF"/>
      <stop offset="1" stop-color="#4B2FD1"/>
    </linearGradient>
    <radialGradient id="a1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B3A6FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B3A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="sShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E1B9E" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <circle cx="140" cy="110" r="200" fill="url(#a1)"/>
    <circle cx="430" cy="440" r="240" fill="url(#a2)"/>
    <circle cx="435" cy="80" r="150" fill="url(#a3)"/>
    <ellipse cx="256" cy="52" rx="300" ry="105" fill="#ffffff" opacity="0.16" filter="url(#soft)"/>
  </g>

  <text x="258" y="356" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="310" font-weight="800" fill="#ffffff" letter-spacing="-6"
        filter="url(#sShadow)">S</text>
</svg>
