<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sia.kr — 프로젝트 허브</title>
  <meta name="description" content="만들고 실험한 서비스를 소개하고 바로 체험할 수 있는 sia.kr의 프로젝트 허브" />
  <link rel="canonical" href="https://sia.kr/" />

  <!-- Open Graph / 소셜 공유 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="sia.kr" />
  <meta property="og:title" content="sia.kr — 프로젝트 허브" />
  <meta property="og:description" content="만들고 실험한 서비스를 소개하고 바로 체험할 수 있는 프로젝트 허브. 40개가 넘는 브라우저 게임도." />
  <meta property="og:url" content="https://sia.kr/" />
  <meta property="og:image" content="https://sia.kr/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="sia.kr — 프로젝트 허브" />
  <meta name="twitter:description" content="만들고 실험한 서비스를 소개하고 바로 체험할 수 있는 프로젝트 허브" />
  <meta name="twitter:image" content="https://sia.kr/og-image.png" />

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F9FD" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1020" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <!-- 테마 깜빡임 방지: React 마운트 전 다크 클래스 적용 -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
